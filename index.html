<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping List</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <h1>My Shopping List</h1>

      <div class="inputs">
        <input type="text" id="item" placeholder="item" />
        <input type="number" id="price-input" placeholder="Price" />
        <button id="add-btn">Add</button>
      </div>

      <ul id="list"></ul>

      <p>Total of all items: Ksh <span id="total-all">0</span></p>
      <p>Total of purchased items: Ksh <span id="total-bought">0</span></p>

      <div class="buttons">
        <button id="mark-btn">Mark Purchased</button>
        <button id="clear-btn">Clear List</button>
      </div>

      <p class="note">
        Click an item to mark it as purchased. Click it again to undo.
      </p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
